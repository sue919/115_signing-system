<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>115學年度中外師資培訓共識營 - 祝福留言牆</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

  <!-- Header -->
  <header class="bg-indigo-900 text-white shadow-md py-6 mb-8 border-b-4 border-amber-400">
    <div class="max-w-4xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <span class="bg-amber-400 text-indigo-950 text-xs font-bold px-2.5 py-0.5 rounded uppercase tracking-wider">Academic Year 2026</span>
        <h1 class="text-2xl font-bold mt-1 flex items-center gap-2">
          <i class="fa-solid fa-graduation-cap text-amber-400"></i> 115學年度中外師資培訓共識營
        </h1>
        <p class="text-indigo-200 text-sm mt-1">Faculty Training & Alignment Workshop - Interactive Blessing Board</p>
      </div>
      <button id="exportBtn" class="bg-amber-500 hover:bg-amber-600 text-indigo-950 font-semibold px-4 py-2 rounded-lg text-sm transition flex items-center gap-2 shadow">
        <i class="fa-solid fa-file-csv"></i> 匯出祝福紀錄 / Export
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 grid md:grid-cols-3 gap-8">
    
    <!-- 表單區塊 -->
    <section class="md:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-fit">
      <h2 class="text-lg font-bold mb-4 text-indigo-950 border-b pb-2 flex items-center justify-between">
        <span><i class="fa-solid fa-pen-to-square text-indigo-600"></i> 寫下祝福 / Blessings</span>
      </h2>
      
      <form id="blessingForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">姓名 / Name</label>
          <input type="text" id="userName" required placeholder="例如：王大明 / David Smith" 
                 class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition text-sm">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">身分與職稱 / Role</label>
          <select id="userRole" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition bg-white text-sm">
            <option value="校長 (Principal)">校長 / Principal</option>
            <option value="主任 (Director)">主任 / Director</option>
            <option value="組長 (Section Chief)">組長 / Section Chief</option>
            <option value="老師 (Teacher)">老師 / Teacher</option>
            <option value="Foreign Teacher">Foreign Teacher</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">祝福與勉勵語 / Wishes & Encouragement</label>
          <textarea id="blessingText" rows="4" required placeholder="寫下對團隊、新學期或教育夥伴的祝福與勉勵..." 
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition resize-none text-sm"></textarea>
        </div>

        <button type="submit" class="w-full bg-indigo-800 hover:bg-indigo-900 text-white py-2.5 rounded-lg font-medium transition shadow flex justify-center items-center gap-2">
          <i class="fa-solid fa-paper-plane"></i> 送出祝福 / Submit
        </button>
      </form>
    </section>

    <!-- 留言牆區塊 -->
    <section class="md:col-span-2 space-y-4">
      <div class="flex justify-between items-center bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-heart text-rose-500"></i> 共識營祝福牆 (<span id="count" class="text-indigo-600">0</span>)
        </h2>
        <span class="text-xs text-slate-400">Real-time blessings</span>
      </div>

      <div id="messagesContainer" class="space-y-4">
        <!-- 動態渲染留言 -->
      </div>
    </section>

  </main>

  <script>
    // 預設共識營祝福範例
    let messages = [
      {
        id: 1,
        name: "張校長",
        role: "校長 (Principal)",
        text: "祝福115學年度團隊合作無間，中外師攜手共創更美好的教學環境，大家新學期加油！",
        time: "2026-09-01 09:30"
      },
      {
        id: 2,
        name: "John Miller",
        role: "Foreign Teacher",
        text: "Wishing everyone a fruitful school year! Excited to collaborate with such an amazing team.",
        time: "2026-09-01 09:45"
      }
    ];

    const form = document.getElementById('blessingForm');
    const container = document.getElementById('messagesContainer');
    const countSpan = document.getElementById('count');
    const exportBtn = document.getElementById('exportBtn');

    // 渲染留言清單
    function renderMessages() {
      container.innerHTML = '';
      countSpan.textContent = messages.length;

      if (messages.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300">
            <p class="text-slate-400 text-sm">目前尚無祝福留言，歡迎在此留下給團隊的勉勵！<br>No messages yet. Be the first to leave a blessing!</p>
          </div>`;
        return;
      }

      messages.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-white p-5 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md transition space-y-3";
        
        // 依據角色套用不同徽章顏色
        let badgeColor = "bg-indigo-50 text-indigo-700 border-indigo-200";
        if (item.role.includes("Foreign")) badgeColor = "bg-amber-50 text-amber-800 border-amber-300";
        if (item.role.includes("校長") || item.role.includes("主任")) badgeColor = "bg-emerald-50 text-emerald-800 border-emerald-200";

        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="font-bold text-slate-800">${escapeHtml(item.name)}</span>
              <span class="text-xs px-2.5 py-0.5 rounded-full border ${badgeColor} font-medium">${escapeHtml(item.role)}</span>
            </div>
            <span class="text-xs text-slate-400">${item.time}</span>
          </div>
          <p class="text-slate-600 text-sm leading-relaxed whitespace-pre-line">${escapeHtml(item.text)}</p>
        `;
        container.appendChild(card);
      });
    }

    // HTML 轉義
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    // 新增留言
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const name = document.getElementById('userName').value.trim();
      const role = document.getElementById('userRole').value;
      const text = document.getElementById('blessingText').value.trim();

      if (!name || !text) return;

      const now = new Date();
      const timeStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      messages.unshift({
        id: Date.now(),
        name,
        role,
        text,
        time: timeStr
      });

      renderMessages();
      form.reset();
    });

    // 匯出 CSV 檔
    exportBtn.addEventListener('click', () => {
      if (messages.length === 0) {
        alert('目前無祝福留言可匯出 / No messages to export');
        return;
      }

      let csvContent = "\uFEFF姓名/Name,身分/Role,祝福與勉勵/Blessings,時間/Time\n";
      messages.forEach(m => {
        const cleanText = `"${m.text.replace(/"/g, '""')}"`;
        csvContent += `"${m.name}","${m.role}",${cleanText},"${m.time}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `115共識營祝福紀錄_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    renderMessages();
  </script>
</body>
</html>
